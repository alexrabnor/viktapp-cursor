services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_DIRECTUS_URL: ${NEXT_PUBLIC_DIRECTUS_URL:-http://host.docker.internal:8790}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web:/app/apps/web
      - /app/apps/web/node_modules
    # Next.js devserver
    command: npm run dev -- -H 0.0.0.0 -p 3000

